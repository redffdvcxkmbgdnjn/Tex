<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Математический тренажер «Здоровое счисление»</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #e0f7fa 0%, #e8f5e9 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
    color: #2c3e50;
  }
  .app {
    width: 100%;
    max-width: 720px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 28px;
  }
  h1 {
    text-align: center;
    color: #00796b;
    font-size: 1.6rem;
    margin-bottom: 8px;
  }
  .subtitle {
    text-align: center;
    color: #607d8b;
    font-size: 0.9rem;
    margin-bottom: 20px;
  }
  .stats {
    display: flex;
    justify-content: space-around;
    background: #f1f8e9;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .stat {
    text-align: center;
    flex: 1;
    min-width: 80px;
  }
  .stat .value {
    font-size: 1.4rem;
    font-weight: bold;
    color: #00695c;
  }
  .stat .label {
    font-size: 0.75rem;
    color: #78909c;
  }
  .task {
    text-align: center;
    font-size: 2.2rem;
    font-weight: bold;
    padding: 20px;
    background: #e0f2f1;
    border-radius: 15px;
    margin-bottom: 18px;
    letter-spacing: 2px;
  }
  .options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 18px;
  }
  .option-btn {
    padding: 16px;
    font-size: 1.3rem;
    border: 2px solid #26a69a;
    border-radius: 12px;
    background: #fff;
    color: #00695c;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: bold;
  }
  .option-btn:hover:not(:disabled) {
    background: #b2dfdb;
    transform: translateY(-2px);
  }
  .option-btn.correct { background: #66bb6a; color: #fff; border-color: #43a047; }
  .option-btn.wrong { background: #ef5350; color: #fff; border-color: #e53935; }
  .option-btn:disabled { cursor: default; }

  .feedback {
    text-align: center;
    font-size: 1.1rem;
    min-height: 30px;
    margin-bottom: 12px;
    font-weight: bold;
  }
  .progress-bar {
    height: 10px;
    background: #e0e0e0;
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #26a69a, #66bb6a);
    width: 0%;
    transition: width 0.3s;
  }
  .health-panel {
    background: #fff8e1;
    border-left: 5px solid #ffb300;
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 16px;
    font-size: 0.9rem;
    display: none;
  }
  .health-panel.show { display: block; animation: fadeIn 0.4s; }
  .health-panel h3 { color: #ef6c00; margin-bottom: 6px; font-size: 1rem; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button.primary {
    padding: 12px 28px;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    background: #00897b;
    color: #fff;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
  }
  button.primary:hover { background: #00695c; }
  button.secondary {
    padding: 12px 28px;
    font-size: 1rem;
    border: 2px solid #00897b;
    border-radius: 10px;
    background: #fff;
    color: #00897b;
    cursor: pointer;
    font-weight: bold;
  }
  .timer {
    text-align: center;
    font-size: 0.85rem;
    color: #78909c;
    margin-top: 10px;
  }
  .timer.warn { color: #e53935; font-weight: bold; }
  .eye-rest {
    text-align: center;
    padding: 30px;
    background: #e8f5e9;
    border-radius: 15px;
    margin-bottom: 16px;
  }
  .eye-rest h2 { color: #2e7d32; margin-bottom: 10px; }
  .eye-rest .circle {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: #a5d6a7;
    margin: 15px auto;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.6; }
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <h1>🌱 «Здоровое счисление»</h1>
  <p class="subtitle">Математический тренажер с заботой о здоровье</p>

  <!-- Статистика -->
  <div class="stats">
    <div class="stat"><div class="value" id="score">0</div><div class="label">Баллы</div></div>
    <div class="stat"><div class="value" id="streak">0</div><div class="label">Серия</div></div>
    <div class="stat"><div class="value" id="solved">0</div><div class="label">Решено</div></div>
    <div class="stat"><div class="value" id="accuracy">—</div><div class="label">Точность</div></div>
  </div>

  <!-- Прогресс -->
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <!-- Игровая зона -->
  <div id="gameArea">
    <div class="task" id="task">Нажмите «Старт»</div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="timer" id="timer">⏱ Время на ответ: 20 с</div>
  </div>

  <!-- Панель здоровья -->
  <div class="health-panel" id="healthPanel">
    <h3>💚 Минутка здоровья</h3>
    <div id="healthText"></div>
  </div>

  <!-- Отдых для глаз -->
  <div class="eye-rest hidden" id="eyeRest">
    <h2>👁 Гимнастика для глаз</h2>
    <p id="eyeInstruction">Смотрите на пульсирующий круг 20 секунд</p>
    <div class="circle"></div>
    <p style="color:#607d8b; font-size:0.85rem;">Затем переведите взгляд на дальний объект</p>
  </div>

  <div class="controls">
    <button class="primary" id="startBtn">Старт</button>
    <button class="secondary" id="resetBtn">Сброс</button>
  </div>
</div>

<script>
// ==== Конфигурация здоровьесбережения ====
const CONFIG = {
  timePerTask: 20,        // секунд на задачу
  tasksPerSession: 10,    // задач за сессию
  healthEvery: 3,         // минутка здоровья каждые N задач
  eyeRestEvery: 5,        // гимнастика для глаз каждые N задач
  eyeRestDuration: 20     // длительность отдыха для глаз (сек)
};

// ==== Состояние ====
let state = {
  running: false,
  score: 0,
  streak: 0,
  solved: 0,
  correct: 0,
  total: 0,
  current: null,
  timer: null,
  timeLeft: 0
};

// ==== Элементы ====
const $ = id => document.getElementById(id);
const taskEl = $('task'), optionsEl = $('options'), feedbackEl = $('feedback'),
      timerEl = $('timer'), healthPanel = $('healthPanel'), healthText = $('healthText'),
      eyeRest = $('eyeRest'), startBtn = $('startBtn'), resetBtn = $('resetBtn');

const HEALTH_TIPS = [
  "Сядьте ровно: спина прямая, ноги на полу, расстояние до экрана — 50–70 см.",
  "Сделайте 5 глубоких вдохов и выдохов — мозг получит больше кислорода.",
  "Потянитесь вверх, поднимите плечи и медленно опустите — снимем напряжение.",
  "Помассируйте кончики пальцев — активизируем мышление.",
  "Встаньте и пройдитесь 30 секунд — улучшим кровообращение.",
  "Поморгайте 10 раз — увлажним глаза.",
  "Выполните наклон головы к плечам по 5 раз в каждую сторону."
];

// ==== Генерация задач ====
function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function generateTask() {
  const types = ['add', 'sub', 'mul', 'div', 'mixed'];
  const type = types[randomInt(0, 4)];
  let a, b, answer, text;

  if (type === 'add') {
    a = randomInt(10, 99); b = randomInt(10, 99);
    answer = a + b; text = `${a} + ${b}`;
  } else if (type === 'sub') {
    a = randomInt(30, 99); b = randomInt(10, a);
    answer = a - b; text = `${a} − ${b}`;
  } else if (type === 'mul') {
    a = randomInt(2, 9); b = randomInt(2, 9);
    answer = a * b; text = `${a} × ${b}`;
  } else if (type === 'div') {
    b = randomInt(2, 9); answer = randomInt(2, 9);
    a = b * answer; text = `${a} ÷ ${b}`;
  } else {
    a = randomInt(5, 20); b = randomInt(2, 5); const c = randomInt(1, 10);
    answer = a * b + c; text = `${a} × ${b} + ${c}`;
  }

  // Варианты ответов
  const opts = new Set([answer]);
  while (opts.size < 4) {
    const delta = randomInt(-10, 10);
    const candidate = answer + (delta === 0 ? 1 : delta);
    if (candidate > 0) opts.add(candidate);
  }
  const options = [...opts].sort(() => Math.random() - 0.5);

  return { text, answer, options };
}

// ==== Отрисовка задачи ====
function renderTask() {
  state.current = generateTask();
  taskEl.textContent = state.current.text + ' = ?';
  feedbackEl.textContent = '';
  feedbackEl.style.color = '';
  optionsEl.innerHTML = '';

  state.current.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(btn, opt);
    optionsEl.appendChild(btn);
  });

  startTimer();
}

// ==== Таймер ====
function startTimer() {
  clearInterval(state.timer);
  state.timeLeft = CONFIG.timePerTask;
  updateTimerDisplay();
  state.timer = setInterval(() => {
    state.timeLeft--;
    updateTimerDisplay();
    if (state.timeLeft <= 0) {
      clearInterval(state.timer);
      timeOut();
    }
  }, 1000);
}

function updateTimerDisplay() {
  timerEl.textContent = `⏱ Время на ответ: ${state.timeLeft} с`;
  timerEl.classList.toggle('warn', state.timeLeft <= 5);
}

function timeOut() {
  state.streak = 0;
  state.total++;
  feedbackEl.textContent = '⏰ Время вышло! Правильный ответ: ' + state.current.answer;
  feedbackEl.style.color = '#e53935';
  disableOptions();
  afterAnswer(false);
}

// ==== Проверка ответа ====
function checkAnswer(btn, value) {
  if (!state.running) return;
  clearInterval(state.timer);
  const isCorrect = value === state.current.answer;
  state.total++;

  if (isCorrect) {
    state.correct++;
    state.solved++;
    state.streak++;
    state.score += 10 + state.streak * 2; // бонус за серию
    btn.classList.add('correct');
    feedbackEl.textContent = state.streak >= 3
      ? `✅ Верно! Серия ${state.streak} — отлично! 🔥`
      : '✅ Верно! Молодец!';
    feedbackEl.style.color = '#2e7d32';
  } else {
    state.streak = 0;
    btn.classList.add('wrong');
    feedbackEl.textContent = `❌ Неверно. Правильный ответ: ${state.current.answer}`;
    feedbackEl.style.color = '#c62828';
    // Подсветить правильный
    [...optionsEl.children].forEach(b => {
      if (+b.textContent === state.current.answer) b.classList.add('correct');
    });
  }

  disableOptions();
  updateStats();
  afterAnswer(isCorrect);
}

function disableOptions() {
  [...optionsEl.children].forEach(b => b.disabled = true);
}

// ==== Логика после ответа ====
function afterAnswer(isCorrect) {
  updateProgress();

  // Проверка на гимнастику для глаз
  if (state.total % CONFIG.eyeRestEvery === 0 && state.total < CONFIG.tasksPerSession) {
    setTimeout(startEyeRest, 800);
    return;
  }

  // Проверка на минутку здоровья
  if (state.total % CONFIG.healthEvery === 0 && state.total < CONFIG.tasksPerSession) {
    showHealthTip();
    setTimeout(nextTask, 2500);
    return;
  }

  // Завершение сессии
  if (state.total >= CONFIG.tasksPerSession) {
    setTimeout(finishSession, 1200);
    return;
  }

  setTimeout(nextTask, 1000);
}

function nextTask() {
  if (!state.running) return;
  renderTask();
}

// ==== Минутка здоровья ====
function showHealthTip() {
  const tip = HEALTH_TIPS[randomInt(0, HEALTH_TIPS.length - 1)];
  healthText.textContent = tip;
  healthPanel.classList.add('show');
  feedbackEl.textContent = '💚 Пауза для здоровья — прочитайте совет!';
  feedbackEl.style.color = '#ef6c00';
  setTimeout(() => healthPanel.classList.remove('show'), 2400);
}

// ==== Гимнастика для глаз ====
function startEyeRest() {
  eyeRest.classList.remove('hidden');
  taskEl.classList.add('hidden');
  optionsEl.classList.add('hidden');
  feedbackEl.classList.add('hidden');
  timerEl.classList.add('hidden');
  startBtn.disabled = true;

  let left = CONFIG.eyeRestDuration;
  $('eyeInstruction').textContent = `Смотрите на пульсирующий круг: ${left} с`;

  const tick = setInterval(() => {
    left--;
    $('eyeInstruction').textContent = `Смотрите на пульсирующий круг: ${left} с`;
    if (left <= 0) {
      clearInterval(tick);
      endEyeRest();
    }
  }, 1000);
}

function endEyeRest() {
  eyeRest.classList.add('hidden');
  taskEl.classList.remove('hidden');
  optionsEl.classList.remove('hidden');
  feedbackEl.classList.remove('hidden');
  timerEl.classList.remove('hidden');
  startBtn.disabled = false;
  nextTask();
}

// ==== Статистика ====
function updateStats() {
  $('score').textContent = state.score;
  $('streak').textContent = state.streak;
  $('solved').textContent = state.solved;
  const acc = state.total > 0 ? Math.round(state.correct / state.total * 100) : 0;
  $('accuracy').textContent = state.total > 0 ? acc + '%' : '—';
}

function updateProgress() {
  const p = Math.min(state.total / CONFIG.tasksPerSession * 100, 100);
  $('progress').style.width = p + '%';
}

// ==== Завершение сессии ====
function finishSession() {
  state.running = false;
  clearInterval(state.timer);
  const acc = Math.round(state.correct / state.total * 100);
  let msg = `🎉 Сессия завершена!\n\nБаллы: ${state.score}\nРешено: ${state.solved}/${CONFIG.tasksPerSession}\nТочность: ${acc}%\n\n`;
  if (acc >= 80) msg += 'Отличный результат! Не забудьте отдохнуть 😊';
  else if (acc >= 50) msg += 'Хорошо! Продолжайте тренироваться 💪';
  else msg += 'Не расстраивайтесь — попробуйте ещё раз!';

  taskEl.textContent = 'Готово!';
  optionsEl.innerHTML = '';
  feedbackEl.textContent = msg;
  feedbackEl.style.color = '#00695c';
  feedbackEl.style.whiteSpace = 'pre-line';
  timerEl.textContent = 'Отдохните 1–2 минуты перед новой сессией 😌';
  startBtn.textContent = 'Начать заново';
}

// ==== Управление ====
startBtn.onclick = () => {
  if (state.running) return;
  state = { running: true, score: 0, streak: 0, solved: 0, correct: 0, total: 0, current: null, timer: null, timeLeft: 0 };
  $('progress').style.width = '0%';
  updateStats();
  startBtn.textContent = 'В процессе...';
  startBtn.disabled = true;
  renderTask();
};

resetBtn.onclick = () => {
  clearInterval(state.timer);
  state.running = false;
  state = { running: false, score: 0, streak: 0, solved: 0, correct: 0, total: 0, current: null, timer: null, timeLeft: 0 };
  updateStats();
  $('progress').style.width = '0%';
  taskEl.textContent = 'Нажмите «Старт»';
  optionsEl.innerHTML = '';
  feedbackEl.textContent = '';
  timerEl.textContent = '⏱ Время на ответ: 20 с';
  timerEl.classList.remove('warn');
  healthPanel.classList.remove('show');
  eyeRest.classList.add('hidden');
  taskEl.classList.remove('hidden');
  optionsEl.classList.remove('hidden');
  feedbackEl.classList.remove('hidden');
  timerEl.classList.remove('hidden');
  startBtn.textContent = 'Старт';
  startBtn.disabled = false;
};
</script>
</body>
</html>
